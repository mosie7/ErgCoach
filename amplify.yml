version: 1
applications:
  - appRoot: apps/web
    backend:
      phases:
        build:
          commands:
            - cd "$(git rev-parse --show-toplevel)"
            - npm install -g pnpm@10.33.3
            - pnpm install --frozen-lockfile
            - pnpm rebuild esbuild
            - export PATH="$PWD/node_modules/.bin:$PATH"
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
            - cp amplify_outputs.json apps/web/amplify_outputs.json || true
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - cd "$(git rev-parse --show-toplevel)"
            - export PATH="$PWD/node_modules/.bin:$PATH"
            - export NODE_OPTIONS="--max-old-space-size=8192"
            - test -f amplify_outputs.json && cp amplify_outputs.json apps/web/amplify_outputs.json || true
            - pnpm --filter @ergcoach/shared build
            - pnpm --filter @ergcoach/training-engine build
            - pnpm --filter @ergcoach/concept2 build
            - pnpm --filter @ergcoach/ai-coach build
            - pnpm --filter @ergcoach/database build
            - pnpm --filter @ergcoach/billing build
            - pnpm --filter @ergcoach/services build
        build:
          commands:
            - cd "$(git rev-parse --show-toplevel)"
            - export NODE_OPTIONS="--max-old-space-size=8192"
            - export PATH="$PWD/node_modules/.bin:$PATH"
            - env | grep -e NEXT_PUBLIC_ -e OPENAI_ -e CONCEPT2_ -e STRIPE_ -e BILLING_ >> apps/web/.env.production || true
            - pnpm --filter @ergcoach/web build
            # Amplify SSR requires a real next install under the app root (pnpm symlinks are not enough).
            - mkdir -p apps/web/node_modules
            - |
              if [ ! -f apps/web/node_modules/next/package.json ]; then
                if [ -d node_modules/next ]; then
                  cp -RL node_modules/next apps/web/node_modules/next
                else
                  NEXT_SRC=$(find node_modules/.pnpm -type d -path '*/node_modules/next' | head -1)
                  cp -RL "$NEXT_SRC" apps/web/node_modules/next
                fi
              fi
            - test -f apps/web/node_modules/next/package.json
            - ls -la apps/web/node_modules/next | head -5
            - du -sh apps/web/.next apps/web/node_modules/next
      artifacts:
        baseDirectory: apps/web/.next
        files:
          - '**/*'
      cache:
        paths:
          - apps/web/.next/cache/**/*
