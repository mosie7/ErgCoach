# ErgCoach — local Postgres (legacy)

> Prefer Amplify Gen 2 sandbox (`pnpm sandbox`) for Cognito + DynamoDB.
> This compose file only remains for optional local experiments against Postgres.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ergcoach
      POSTGRES_PASSWORD: ergcoach
      POSTGRES_DB: ergcoach
    ports:
      - "5432:5432"
    volumes:
      - ergcoach_pg:/var/lib/postgresql/data

volumes:
  ergcoach_pg:
